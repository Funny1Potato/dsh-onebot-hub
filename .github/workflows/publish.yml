name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只跑测试与 npm pack --dry-run，不真的发布'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # npm provenance（--provenance 需要 OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm install --omit=peer --no-audit --no-fund

      - name: Tag 与 package.json 版本必须一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $ver 不一致"
            exit 1
          fi
          echo "发布 $ver"

      - name: Tests
        run: npm test

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack（dry-run 模式下确认打包内容）
        if: ${{ inputs.dry-run }}
        run: npm pack --dry-run