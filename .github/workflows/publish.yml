name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只跑测试与 npm pack --dry-run，不真的发布'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # Trusted Publishing 的 OIDC 身份（npm publish 走 OIDC 免 token，provenance 自动附带）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted Publishing 要求 npm ≥ 11.5.1；node 22 自带的是 10.x，必须先升
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm install --omit=peer --legacy-peer-deps --no-audit --no-fund

      - name: Tag 与 package.json 版本必须一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $ver 不一致"
            exit 1
          fi
          echo "发布 $ver"

      - name: Tests
        run: npm test

      # Trusted Publishing：npm 自动用 OIDC 换临时凭据，无需任何 secret/token
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish

      - name: Pack（dry-run 模式下确认打包内容）
        if: ${{ inputs.dry-run }}
        run: npm pack --dry-run