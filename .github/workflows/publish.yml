name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只跑测试与 npm pack --dry-run，不真的发布'
        type: boolean
        default: true

permissions:
  contents: write   # 打 tag 时要自动建 GitHub Release（gh release create 用 github.token）
  id-token: write   # Trusted Publishing 的 OIDC 身份（npm publish 走 OIDC 免 token，provenance 自动附带）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted Publishing 要求 npm ≥ 11.5.1；node 22 自带的是 10.x，必须先升
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm install --omit=peer --legacy-peer-deps --no-audit --no-fund

      - name: Tag 与 package.json 版本必须一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $ver 不一致"
            exit 1
          fi
          echo "发布 $ver"

      - name: Tests
        run: npm test

      # Trusted Publishing：npm 自动用 OIDC 换临时凭据，无需任何 secret/token
      #
      # 预发布（版本号带 `-`，如 `0.11.0-beta.1`）**必须**发到 `next` 这个 dist-tag 上。
      # `npm publish` 默认一律打 `latest`——预发布版要是占了 `latest`，所有 `npm install`
      # 的人都会装到 beta，而 `latest` 一旦被新版覆盖，旧的那条就再没有"回退点"了。
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          ver="$(node -p "require('./package.json').version")"
          case "$ver" in
            *-*)
              echo "预发布 $ver → dist-tag next"
              npm publish --tag next
              ;;
            *)
              npm publish
              ;;
          esac

      # 打 tag 发布成功后自动建同名 GitHub Release，附上与 npm 同一内容的 tarball；
      # release 已存在（重跑）时退化为重新上传资产。预发布要标 `--prerelease`，
      # 否则 GitHub 会把它当成"最新正式版"挂在仓库首页。
      - name: GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          npm pack --pack-destination dist
          case "$(node -p "require('./package.json').version")" in
            *-*) pre="--prerelease" ;;
            *)   pre="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $pre --title "$GITHUB_REF_NAME" --generate-notes dist/*.tgz \
            || gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber

      - name: Pack（dry-run 模式下确认打包内容）
        if: ${{ inputs.dry-run }}
        run: npm pack --dry-run