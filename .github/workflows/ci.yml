name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `@deepseek-ai/*` 是宿主提供的 peer 依赖，测试用 test/register-stubs.mjs 打桩，
      # 所以只装真正的运行时依赖 `ws`。`--omit=peer` 不够用：npm 仍会解析 peer 依赖树，
      # 而 registry 上那几个宿主包自己的 peer 区间互相冲突（首跑 ERESOLVE 就是这么炸的），
      # `--legacy-peer-deps` 才是让 npm 彻底不管 peerDependencies 的开关。
      - name: Install
        run: npm install --omit=peer --legacy-peer-deps --no-audit --no-fund

      - name: Tests
        run: npm test