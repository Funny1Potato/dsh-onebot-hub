name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 一律用 `npm install`，不用 `npm ci`：这个仓库在本机是**链进** DSH 的 node_modules 里跑的，
      # 开发机上生成的 lockfile 会把宿主侧依赖记成 `link:` 加绝对路径。`npm ci` 严格照 lockfile 装，
      # 一遇到这种条目就装不出来；`npm install` 会按 package.json 重新解析。（lockfile 现在由干净目录生成，
      # 已经不含本机路径，但这一层保险留着。）
      #
      # `--legacy-peer-deps` 是必需的：`@deepseek-ai/*` 这些宿主包在 registry 上的 peer 区间
      # 互相冲突（首跑 ERESOLVE 就是这么炸的）。`--omit=optional` 只是省时间。
      # **不要加 `--omit=peer`**：那会让 npm 连普通依赖的安装计划也一起变小，
      # 结果 `ws` 没装上，测试跑起来一片 `Cannot find package 'ws'`（2026-11-04 踩过）。
      - name: Install
        run: npm install --legacy-peer-deps --omit=optional --no-audit --no-fund

      - name: Tests
        run: npm test
