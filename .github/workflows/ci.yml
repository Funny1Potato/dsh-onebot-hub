name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 一律用 `npm install`，不用 `npm ci`：仓库自带的 lockfile 是开发机上生成的，
      # 里面记着宿主侧 `link:` 依赖的绝对路径（`ws` / `schemastery` 在本机是从 DSH 的
      # node_modules 链过去的），`npm ci` 在干净机上会照着那份 lockfile 装，一个包都装不上；
      # `npm install` 会按 package.json 重新解析。
      #
      # `--legacy-peer-deps` 是必需的：`@deepseek-ai/*` 这些宿主包在 registry 上的 peer 区间
      # 互相冲突（首跑 ERESOLVE 就是这么炸的）。`--omit=optional` 只是省时间。
      # **不要加 `--omit=peer`**：那会让 npm 连普通依赖的安装计划也一起变小，
      # 结果 `ws` 没装上，测试跑起来一片 `Cannot find package 'ws'`（2026-11-04 踩过）。
      - name: Install
        run: npm install --legacy-peer-deps --omit=optional --no-audit --no-fund

      - name: Tests
        run: npm test
